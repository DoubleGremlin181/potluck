# Potluck Docker Compose
#
# Usage:
#   Development: docker compose up -d
#   Testing:     docker compose --profile test run --rm test
#   DB only:     docker compose up -d db redis
#
# For end-users (install without git clone), use install.sh which downloads
# docker-compose.prod.yml with pre-built GHCR images.

services:
  # ==========================================================================
  # Application service (development - builds locally)
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        GPU: ${GPU:-false}
    container_name: potluck-app
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Test service (testing - mounts tests/src for live reload)
  # Uses the same image as app service (potluck:latest in CI)
  # ==========================================================================
  test:
    profiles: ["test"]
    image: potluck:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args:
        GPU: ${GPU:-false}
    container_name: potluck-test
    command: ["uv", "run", "pytest", "-v", "--tb=short"]
    environment:
      # Use same credentials as db service (from .env or defaults)
      DATABASE_URL: postgresql://${POSTGRES_USER:-potluck}:${POSTGRES_PASSWORD:-potluck}@db:5432/${POSTGRES_DB:-potluck}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-potluck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-potluck}
      POSTGRES_DB: ${POSTGRES_DB:-potluck}
      REDIS_URL: redis://redis:6379/0
      TESTING: "true"
      CI: ${CI:-false}
    volumes:
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================================================
  # Database (Percona PostgreSQL 17 with pgvector + pg_tde)
  # ==========================================================================
  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    container_name: potluck-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-potluck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-potluck}
      POSTGRES_DB: ${POSTGRES_DB:-potluck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - potluck-pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-potluck} -d ${POSTGRES_DB:-potluck}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Redis (for Celery task queue)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: potluck-redis
    volumes:
      - potluck-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  potluck-pgdata:
    name: potluck-pgdata
  potluck-redis:
    name: potluck-redis
