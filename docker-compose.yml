# Potluck Docker Compose
#
# Unified configuration with profiles for development and production.
# Set COMPOSE_PROFILES in .env to control which services start:
#   - dev:  Build images locally (for contributors)
#   - prod: Use pre-built GHCR images (for end-users)
#
# Usage:
#   Development:  COMPOSE_PROFILES=dev docker compose up -d
#   Production:   COMPOSE_PROFILES=prod docker compose up -d
#   Testing:      docker compose --profile test run --rm test
#   DB only:      docker compose up -d db redis
#
# GPU Support (production only - requires nvidia-container-toolkit):
#   Set POTLUCK_VERSION=gpu in .env to use GPU image from GHCR
#
# Scripts automatically set COMPOSE_PROFILES:
#   - setup.sh sets COMPOSE_PROFILES=dev
#   - install.sh sets COMPOSE_PROFILES=prod

services:
  # ==========================================================================
  # Application - Development (builds locally)
  # ==========================================================================
  app:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GPU: ${GPU:-false}
    container_name: potluck-app
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================================
  # Application - Production (uses GHCR images)
  # For GPU: set POTLUCK_VERSION=gpu in .env
  # ==========================================================================
  app-prod:
    profiles: ["prod"]
    image: ghcr.io/doublegremlin181/potluck:${POTLUCK_VERSION:-latest}
    container_name: potluck-app
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db-prod:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # GPU support - uncomment when using POTLUCK_VERSION=gpu:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ==========================================================================
  # Test runner
  # ==========================================================================
  test:
    profiles: ["test"]
    image: potluck:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GPU: ${GPU:-false}
    container_name: potluck-test
    command: ["uv", "run", "pytest", "-v", "--tb=short"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-potluck}:${POSTGRES_PASSWORD:-potluck}@db:5432/${POSTGRES_DB:-potluck}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-potluck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-potluck}
      POSTGRES_DB: ${POSTGRES_DB:-potluck}
      REDIS_URL: redis://redis:6379/0
      TESTING: "true"
      CI: ${CI:-false}
    volumes:
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================================================
  # Database - Development (builds locally)
  # ==========================================================================
  db:
    profiles: ["dev", "test"]
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    container_name: potluck-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-potluck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-potluck}
      POSTGRES_DB: ${POSTGRES_DB:-potluck}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - potluck-pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-potluck} -d ${POSTGRES_DB:-potluck}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Database - Production (uses GHCR images)
  # ==========================================================================
  db-prod:
    profiles: ["prod"]
    image: ghcr.io/doublegremlin181/potluck-db:${POTLUCK_VERSION:-latest}
    container_name: potluck-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-potluck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-potluck}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - potluck-pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-potluck} -d ${POSTGRES_DB:-potluck}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ==========================================================================
  # Redis (shared - no profile, always available)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: potluck-redis
    volumes:
      - potluck-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  potluck-pgdata:
    name: potluck-pgdata
  potluck-redis:
    name: potluck-redis
