[project]
name = "potluck"
version = "1.0.0a1"
description = "Privacy-first personal knowledge database for your AI — local-first, MCP-native"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "DoubleGremlin181" }]
keywords = ["mcp", "knowledge-base", "personal-data", "google-takeout", "local-first"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastmcp>=3",
    "platformdirs>=4.3",
    "httpx>=0.28",
]

[project.scripts]
potluck = "potluck.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/potluck"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]  # B008: Typer uses function calls in argument defaults

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "bench: benchmark scenarios (excluded by default)",
    "e2e: full end-to-end tests (excluded by default)",
    "browser: Playwright browser tests (excluded by default)",
]
addopts = "-m 'not bench and not e2e and not browser'"
