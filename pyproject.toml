[project]
name = "potluck"
version = "1.0.0a1"
description = "Privacy-first personal knowledge database for your AI — local-first, MCP-native"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "DoubleGremlin181" }]
keywords = ["mcp", "knowledge-base", "personal-data", "google-takeout", "local-first"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastmcp>=3",
    "platformdirs>=4.3",
    "httpx>=0.28",
]

[project.scripts]
potluck = "potluck.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/potluck"]
