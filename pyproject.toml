[project]
name = "potluck"
version = "1.0.0b1"
description = "Privacy-first personal knowledge database for your AI — local-first, MCP-native"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "DoubleGremlin181" }]
keywords = ["mcp", "knowledge-base", "personal-data", "google-takeout", "local-first"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastmcp>=3",
    "platformdirs>=4.3",
    "python-multipart>=0.0.20",  # FastAPI multipart form parsing (POST /api/imports/upload)
    "httpx>=0.28",
    # starlette 1.x TestClient backend: the shipped bench scenarios import
    # fastapi.testclient, and with only httpx 0.x installed every CLI
    # invocation of a non-dev install printed a deprecation warning (#141).
    "httpx2>=2",
    "rich>=13",
]

[project.scripts]
potluck = "potluck.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/potluck"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4",
    "import-linter>=2",
    "pytest-asyncio>=0.25",
    "pytest-xdist>=3.6",
    "pytest-playwright>=0.6",
    "playwright>=1.49",
]

[tool.importlinter]
root_package = "potluck"

# Interfaces are thin adapters: they reach data only THROUGH services.
# (Indirect chains like cli -> services -> storage are the design, hence allowed.)
[[tool.importlinter.contracts]]
name = "api/mcp/cli import only services + models (+ core infrastructure)"
type = "forbidden"
source_modules = ["potluck.api", "potluck.mcp", "potluck.cli"]
forbidden_modules = ["potluck.storage", "potluck.ingest", "potluck.enrich", "potluck.search"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "lower layers never import interfaces"
type = "forbidden"
source_modules = [
    "potluck.core",
    "potluck.models",
    "potluck.storage",
    "potluck.services",
    "potluck.ingest",
    "potluck.enrich",
    "potluck.search",
    "potluck.testing",
    "potluck.bench",
]
forbidden_modules = ["potluck.api", "potluck.mcp", "potluck.cli"]
# Sole sanctioned exception: the API-search bench scenario (#131) measures
# the REST adapter end-to-end, so it must build the FastAPI app.
ignore_imports = ["potluck.bench.scenarios -> potluck.api.app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]  # B008: Typer uses function calls in argument defaults

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "bench: benchmark scenarios (excluded by default)",
    "e2e: full end-to-end tests (excluded by default)",
    "browser: Playwright browser tests (excluded by default)",
]
addopts = "-m 'not bench and not e2e and not browser'"
