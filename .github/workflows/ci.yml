name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/ alembic/

      - name: Run ruff format check
        run: ruff format --check src/ tests/ alembic/

      - name: Run mypy
        run: mypy src/ tests/ alembic/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration --cov=potluck --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: potluck
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: potluck
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=potluck
          POSTGRES_PASSWORD=testpassword
          POSTGRES_DB=potluck
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          EOF

      - name: Run migrations
        run: |
          export DATABASE_URL="postgresql://potluck:testpassword@localhost:5432/potluck"
          alembic upgrade head

      - name: Run E2E tests
        run: pytest tests/integration/ -v --run-e2e
