name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/ alembic/

      - name: Run ruff format check
        run: ruff format --check src/ tests/ alembic/

      - name: Run mypy
        run: mypy src/ tests/ alembic/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration --cov=potluck --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=potluck
          POSTGRES_PASSWORD=testpassword
          POSTGRES_DB=potluck
          POSTGRES_HOST=localhost
          POSTGRES_PORT=5432
          EOF

      - name: Start database with docker-compose
        run: |
          docker compose up -d db
          # Wait for database to be healthy
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U potluck -d potluck; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Run migrations
        run: |
          export DATABASE_URL="postgresql://potluck:testpassword@localhost:5432/potluck"
          alembic upgrade head

      - name: Run E2E tests
        run: pytest tests/integration/ -v --run-e2e

      - name: Stop database
        if: always()
        run: docker compose down -v
