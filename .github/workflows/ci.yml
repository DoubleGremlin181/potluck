name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run python scripts/check_fixtures.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -n auto

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  browser-smoke:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run potluck bench run --tier smoke --json bench-out.json
      # Tolerance 100% while the only scenario is the tiny I/O-bound P0
      # placeholder: shared-runner variance alone exceeds 30% (observed
      # 111->165 ms on identical code). Catches blowups, not noise. Tighten
      # to ±30% + 1x-vs-4x scaling assertions with the real P1 scenarios.
      - run: >
          uv run potluck bench compare
          benchmarks/baselines-ci.json bench-out.json --tolerance 100
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-smoke-results
          path: bench-out.json
          retention-days: 30
