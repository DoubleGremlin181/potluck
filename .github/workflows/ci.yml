name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check src/ tests/ alembic/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/ alembic/

      - name: Run mypy
        run: uv run mypy src/ tests/ alembic/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          load: true
          tags: potluck:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_USER=potluck
          POSTGRES_PASSWORD=testpassword
          POSTGRES_DB=potluck_test
          POSTGRES_HOST=db
          POSTGRES_PORT=5432
          REDIS_URL=redis://redis:6379/0
          EOF

      - name: Start services
        run: docker compose -f docker-compose.test.yml up -d db redis

      - name: Wait for DB
        run: |
          for i in {1..30}; do
            if docker compose -f docker-compose.test.yml exec -T db pg_isready -U potluck -d potluck_test; then
              echo "Database is ready"
              break
            fi
            echo "Waiting for database... ($i/30)"
            sleep 2
          done

      - name: Run all tests
        run: |
          docker compose -f docker-compose.test.yml run --rm test \
            uv run pytest tests/ -v --run-e2e --cov=potluck --cov-report=xml

      - name: Copy coverage report
        if: always()
        run: |
          docker compose -f docker-compose.test.yml cp test:/app/coverage.xml ./coverage.xml 2>/dev/null || true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
