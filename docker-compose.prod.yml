# Production Docker Compose for Potluck
# Uses pre-built images from GitHub Container Registry (GHCR)
# For end-users who want to run Potluck without building from source
#
# Usage:
#   1. Run install script: curl -fsSL https://raw.githubusercontent.com/.../install.sh | bash
#   2. Or manually: docker compose -f docker-compose.prod.yml up -d
#
# GPU Support:
#   Set GPU=true in .env and add deploy.resources to app service

services:
  app:
    image: ghcr.io/doublegremlin181/potluck:${POTLUCK_VERSION:-latest}
    container_name: potluck-app
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Uncomment for GPU support (requires nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  db:
    image: ghcr.io/doublegremlin181/potluck-db:${POTLUCK_VERSION:-latest}
    container_name: potluck-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-potluck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-potluck}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - potluck-pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-potluck} -d ${POSTGRES_DB:-potluck}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: potluck-redis
    volumes:
      - potluck-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  potluck-pgdata:
    name: potluck-pgdata
  potluck-redis:
    name: potluck-redis
