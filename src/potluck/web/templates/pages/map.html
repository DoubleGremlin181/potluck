{% extends "base.html" %}

{% block title %}Map — Potluck{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/leaflet.css">
<link rel="stylesheet" href="/static/css/leaflet.markercluster.css">
<style>
  #map-container {
    height: 600px;
    border-radius: 0.75rem;
    overflow: hidden;
    border: 1px solid oklch(var(--b3) / 0.6);
    box-shadow: 0 4px 24px oklch(var(--bc) / 0.04);
  }
  /* Theme-aware popups */
  .leaflet-popup-content-wrapper {
    background: oklch(var(--b1));
    color: oklch(var(--bc));
    border-radius: 0.75rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    box-shadow: 0 4px 24px oklch(var(--bc) / 0.12);
  }
  .leaflet-popup-tip { background: oklch(var(--b1)); }
  .leaflet-popup-content { margin: 10px 14px; }
  /* divIcon cleanup — remove default leaflet marker background */
  .potluck-marker { background: transparent !important; border: none !important; }
  /* Popup detail styling */
  .popup-title {
    font-weight: 600;
    text-decoration: none;
    color: oklch(var(--p));
    display: block;
    margin-bottom: 4px;
  }
  .popup-title:hover { text-decoration: underline; }
  .popup-badge {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 9999px;
    background: oklch(var(--b2));
    color: oklch(var(--bc) / 0.6);
    margin-bottom: 6px;
  }
  .popup-details { font-size: 12px; color: oklch(var(--bc) / 0.7); line-height: 1.5; }
  .popup-details b { color: oklch(var(--bc) / 0.9); }
  .popup-thumb {
    width: 100%;
    max-height: 140px;
    object-fit: cover;
    border-radius: 0.5rem;
    margin-bottom: 6px;
  }
</style>
{% endblock %}

{% block content %}
<div class="space-y-6">

  <div class="animate-in flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-display font-bold tracking-tight">Map</h1>
      <div class="flex items-center gap-3 mt-2">
        <div class="divider-accent"></div>
        <p class="text-base-content/50">Geolocated entities</p>
      </div>
    </div>

    <!-- Type filters -->
    <div class="flex flex-wrap gap-2">
      {% for et in entity_types %}
      <label class="filter-chip cursor-pointer flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-base-300/60 text-xs">
        <input type="checkbox" value="{{ et }}" class="checkbox checkbox-xs checkbox-primary map-type-filter" checked
          onchange="loadMarkers()">
        <span>{{ et | replace('_', ' ') | title }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <!-- Date filter -->
  <div class="animate-in animate-in-delay-1 flex flex-wrap items-center gap-3">
    <label class="text-xs text-base-content/50">From</label>
    <input type="date" id="map-since" value="{{ since }}" class="input input-bordered input-sm bg-base-200/50 w-40">
    <label class="text-xs text-base-content/50">To</label>
    <input type="date" id="map-until" value="{{ until }}" class="input input-bordered input-sm bg-base-200/50 w-40">
    <button type="button" onclick="loadMarkers()" class="btn btn-ghost btn-sm">Filter</button>
  </div>

  <div id="map-container" class="animate-in animate-in-delay-2"></div>
  <p id="marker-count" class="text-xs text-base-content/40"></p>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/leaflet.min.js"></script>
<script src="/static/js/leaflet.markercluster.min.js"></script>
<script>
  var map = L.map('map-container').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  var markerLayer = L.markerClusterGroup({
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    zoomToBoundsOnClick: true,
    disableClusteringAtZoom: 18,
  });
  map.addLayer(markerLayer);

  var typeColors = {
    media: '#b87333',
    location: '#3b8686',
    location_visit: '#1e7070',
    calendar_event: '#4aba7c'
  };

  function makeDotIcon(color) {
    return L.divIcon({
      className: 'potluck-marker',
      html: '<div style="width:12px;height:12px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.3);"></div>',
      iconSize: [12, 12],
      iconAnchor: [6, 6],
      popupAnchor: [0, -8],
    });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
  }

  function buildPopup(m) {
    var html = '';
    var extras = m.extras || {};

    // Thumbnail for media
    if (extras._media_id) {
      html += '<img class="popup-thumb" src="/media/thumb/' + encodeURIComponent(extras._media_id) + '" loading="lazy" onerror="this.style.display=\'none\'">';
    }

    // Title link
    html += '<a class="popup-title" href="/entity/' + encodeURIComponent(m.type) + '/' + encodeURIComponent(m.id) + '">' + escapeHtml(m.title) + '</a>';

    // Type badge
    html += '<span class="popup-badge">' + escapeHtml(m.type.replace(/_/g, ' ')) + '</span>';

    // Detail lines from extras
    var details = '';
    for (var key in extras) {
      if (key.charAt(0) === '_') continue;
      details += '<b>' + escapeHtml(key) + ':</b> ' + escapeHtml(extras[key]) + '<br>';
    }
    if (details) {
      html += '<div class="popup-details">' + details + '</div>';
    }

    return html;
  }

  function loadMarkers() {
    var bounds = map.getBounds();
    var types = [];
    document.querySelectorAll('.map-type-filter:checked').forEach(function(cb) {
      types.push(cb.value);
    });

    var params = new URLSearchParams();
    params.append('south', bounds.getSouth());
    params.append('north', bounds.getNorth());
    params.append('west', bounds.getWest());
    params.append('east', bounds.getEast());
    types.forEach(function(t) { params.append('type', t); });

    var sinceVal = document.getElementById('map-since');
    var untilVal = document.getElementById('map-until');
    if (sinceVal && sinceVal.value) params.append('since', sinceVal.value);
    if (untilVal && untilVal.value) params.append('until', untilVal.value);

    fetch('/map/markers?' + params.toString())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        markerLayer.clearLayers();
        data.markers.forEach(function(m) {
          var color = typeColors[m.type] || '#6366f1';
          L.marker([m.lat, m.lng], { icon: makeDotIcon(color) })
            .bindPopup(buildPopup(m), { maxWidth: 280, minWidth: 180 })
            .addTo(markerLayer);
        });
        document.getElementById('marker-count').textContent = data.markers.length + ' markers loaded';
      });
  }

  map.on('moveend', loadMarkers);
  loadMarkers();
</script>
{% endblock %}
