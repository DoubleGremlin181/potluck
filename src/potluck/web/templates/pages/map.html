{% extends "base.html" %}

{% block title %}Map — Potluck{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/leaflet.css">
<style>
  #map-container {
    height: 600px;
    border-radius: 0.75rem;
    overflow: hidden;
    border: 1px solid oklch(var(--b3) / 0.6);
    box-shadow: 0 4px 24px oklch(var(--bc) / 0.04);
  }
  .leaflet-popup-content { font-family: 'DM Sans', sans-serif; font-size: 13px; }
  .leaflet-popup-content-wrapper { border-radius: 0.75rem; }
</style>
{% endblock %}

{% block content %}
<div class="space-y-6">

  <div class="animate-in flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-display font-bold tracking-tight">Map</h1>
      <div class="flex items-center gap-3 mt-2">
        <div class="divider-accent"></div>
        <p class="text-base-content/50">Geolocated entities</p>
      </div>
    </div>

    <!-- Type filters -->
    <div class="flex flex-wrap gap-2">
      {% for et in entity_types %}
      <label class="filter-chip cursor-pointer flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-base-300/60 text-xs">
        <input type="checkbox" value="{{ et }}" class="checkbox checkbox-xs checkbox-primary map-type-filter" checked
          onchange="loadMarkers()">
        <span>{{ et | replace('_', ' ') | title }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <!-- Date filter -->
  <div class="animate-in animate-in-delay-1 flex flex-wrap items-center gap-3">
    <label class="text-xs text-base-content/50">From</label>
    <input type="date" id="map-since" value="{{ since }}" class="input input-bordered input-sm bg-base-200/50 w-40">
    <label class="text-xs text-base-content/50">To</label>
    <input type="date" id="map-until" value="{{ until }}" class="input input-bordered input-sm bg-base-200/50 w-40">
    <button type="button" onclick="loadMarkers()" class="btn btn-ghost btn-sm">Filter</button>
  </div>

  <div id="map-container" class="animate-in animate-in-delay-2"></div>
  <p id="marker-count" class="text-xs text-base-content/40"></p>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/leaflet.min.js"></script>
<script>
  var map = L.map('map-container').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  var markerLayer = L.layerGroup().addTo(map);

  var typeColors = {
    media: '#b87333',
    location: '#3b8686',
    location_visit: '#1e7070',
    calendar_event: '#4aba7c'
  };

  function loadMarkers() {
    var bounds = map.getBounds();
    var types = [];
    document.querySelectorAll('.map-type-filter:checked').forEach(function(cb) {
      types.push(cb.value);
    });

    var params = new URLSearchParams();
    params.append('south', bounds.getSouth());
    params.append('north', bounds.getNorth());
    params.append('west', bounds.getWest());
    params.append('east', bounds.getEast());
    types.forEach(function(t) { params.append('type', t); });

    var sinceVal = document.getElementById('map-since');
    var untilVal = document.getElementById('map-until');
    if (sinceVal && sinceVal.value) params.append('since', sinceVal.value);
    if (untilVal && untilVal.value) params.append('until', untilVal.value);

    fetch('/map/markers?' + params.toString())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        markerLayer.clearLayers();
        data.markers.forEach(function(m) {
          var color = typeColors[m.type] || '#6366f1';
          L.circleMarker([m.lat, m.lng], {
            radius: 7,
            fillColor: color,
            fillOpacity: 0.85,
            color: '#fff',
            weight: 1.5
          })
            .bindPopup('<a href="/entity/' + encodeURIComponent(m.type) + '/' + encodeURIComponent(m.id) + '" style="font-weight:600;text-decoration:none">' + escapeHtml(m.title) + '</a><br><small>' + escapeHtml(m.type.replace('_', ' ')) + '</small>')
            .addTo(markerLayer);
        });
        document.getElementById('marker-count').textContent = data.markers.length + ' markers loaded';
      });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.textContent;
  }

  map.on('moveend', loadMarkers);
  loadMarkers();
</script>
{% endblock %}
