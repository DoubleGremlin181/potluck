{% extends "base.html" %}

{% block title %}Map — Potluck{% endblock %}

{% block head %}
<link rel="stylesheet" href="/static/css/leaflet.css">
<style>
  #map-container { height: 600px; border-radius: 0.75rem; overflow: hidden; border: 1px solid oklch(var(--b3)); }
  .leaflet-popup-content { font-family: 'DM Sans', sans-serif; font-size: 13px; }
  .leaflet-popup-content-wrapper { border-radius: 0.5rem; }
</style>
{% endblock %}

{% block content %}
<div class="space-y-6">

  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl font-display font-bold">Map</h1>
      <p class="text-base-content/60 mt-1">Geolocated entities</p>
    </div>

    <!-- Type filters -->
    <div class="flex flex-wrap gap-2">
      {% for et in entity_types %}
      <label class="label cursor-pointer gap-1.5 p-0">
        <input type="checkbox" value="{{ et }}" class="checkbox checkbox-xs checkbox-primary map-type-filter" checked
          onchange="loadMarkers()">
        <span class="label-text text-xs">{{ et | replace('_', ' ') | title }}</span>
      </label>
      {% endfor %}
    </div>
  </div>

  <div id="map-container"></div>
  <p id="marker-count" class="text-xs text-base-content/50"></p>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/leaflet.min.js"></script>
<script>
  var map = L.map('map-container').setView([20, 0], 2);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19,
  }).addTo(map);

  var markerLayer = L.layerGroup().addTo(map);

  function loadMarkers() {
    var bounds = map.getBounds();
    var types = [];
    document.querySelectorAll('.map-type-filter:checked').forEach(function(cb) {
      types.push(cb.value);
    });

    var params = new URLSearchParams();
    params.append('south', bounds.getSouth());
    params.append('north', bounds.getNorth());
    params.append('west', bounds.getWest());
    params.append('east', bounds.getEast());
    types.forEach(function(t) { params.append('type', t); });

    fetch('/map/markers?' + params.toString())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        markerLayer.clearLayers();
        data.markers.forEach(function(m) {
          L.marker([m.lat, m.lng])
            .bindPopup('<strong>' + escapeHtml(m.title) + '</strong><br><small>' + escapeHtml(m.type.replace('_', ' ')) + '</small>')
            .addTo(markerLayer);
        });
        document.getElementById('marker-count').textContent = data.markers.length + ' markers loaded';
      });
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.textContent;
  }

  map.on('moveend', loadMarkers);
  loadMarkers();
</script>
{% endblock %}
