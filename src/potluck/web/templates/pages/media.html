{% extends "base.html" %}
{% from "components/pagination.html" import pagination %}

{% block title %}Media — Potluck{% endblock %}

{% block content %}
<div class="space-y-6">

  <div class="animate-in flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-display font-bold tracking-tight">Media</h1>
      <div class="flex items-center gap-3 mt-2">
        <div class="divider-accent"></div>
        <p class="text-base-content/50">{{ "{:,}".format(total) }} items</p>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <form
    hx-get="/media"
    hx-target="#media-grid"
    hx-swap="innerHTML"
    hx-push-url="true"
    class="animate-in animate-in-delay-1 flex flex-wrap items-end gap-3"
  >
    <div class="form-control">
      <label class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-1">Type</label>
      <select name="media_type" class="select select-bordered select-sm bg-base-200/50">
        <option value="">All types</option>
        {% for mt in media_types %}
        <option value="{{ mt }}" {{ 'selected' if mt == media_type }}>{{ mt | title }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-control">
      <label class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-1">Search</label>
      <input type="text" name="q" value="{{ q }}" placeholder="Caption/OCR text..."
        class="input input-bordered input-sm w-48 bg-base-200/50">
    </div>

    <label class="filter-chip cursor-pointer flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-base-300/60 text-xs">
      <input type="checkbox" name="has_ocr" {{ 'checked' if has_ocr }}
        class="checkbox checkbox-xs checkbox-primary">
      <span>Has OCR</span>
    </label>

    <button type="submit" class="btn btn-primary btn-sm">Filter</button>
    <a href="/media" class="btn btn-ghost btn-sm">Clear</a>
  </form>

  <!-- Grid -->
  <div id="media-grid" class="animate-in animate-in-delay-2">
    {% include "partials/media_grid.html" %}
  </div>

</div>

<!-- Lightbox modal -->
<dialog id="lightbox" class="modal">
  <div class="modal-box w-11/12 max-w-5xl p-0 overflow-hidden bg-base-200 rounded-2xl">
    <form method="dialog">
      <button class="btn btn-sm btn-circle btn-ghost absolute right-3 top-3 z-10 bg-black/30 text-white hover:bg-black/50 border-0">&#10005;</button>
    </form>
    <div id="lightbox-content" class="flex flex-col lg:flex-row">
      <!-- Content loaded via HTMX -->
    </div>
  </div>
  <form method="dialog" class="modal-backdrop bg-black/60"><button>close</button></form>
</dialog>
{% endblock %}

{% block scripts %}
<script>
  // Open lightbox on thumbnail click
  document.addEventListener('htmx:afterSwap', function(e) {
    if (e.detail.target.id === 'lightbox-content') {
      document.getElementById('lightbox').showModal();
    }
  });
</script>
{% endblock %}
