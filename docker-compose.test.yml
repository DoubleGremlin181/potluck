# Docker Compose for running tests in production-identical environment
#
# Uses the EXACT SAME Dockerfile as production to ensure test relevance.
# Tests are mounted at runtime (not baked into the image).
#
# Usage:
#   # Run all tests
#   docker compose -f docker-compose.test.yml run --rm test
#
#   # Run specific test files
#   docker compose -f docker-compose.test.yml run --rm test uv run pytest tests/unit/ -v
#
#   # Run with e2e tests
#   docker compose -f docker-compose.test.yml run --rm test uv run pytest tests/ -v --run-e2e

services:
  test:
    build:
      context: .
      dockerfile: docker/Dockerfile.app  # Same as production!
    container_name: potluck-test
    # Override the default CMD to run tests instead of the web server
    command: ["uv", "run", "pytest", "-v", "--tb=short"]
    environment:
      # Test database connection
      DATABASE_URL: postgresql://potluck:potluck@db:5432/potluck_test
      POSTGRES_USER: potluck
      POSTGRES_PASSWORD: potluck
      POSTGRES_DB: potluck_test
      # Redis for Celery
      REDIS_URL: redis://redis:6379/0
      # Test mode
      TESTING: "true"
      # CI environment detection (inherit from host)
      CI: ${CI:-false}
    volumes:
      # Mount tests and src for live reload during development
      - ./tests:/app/tests:ro
      - ./src:/app/src:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: docker/Dockerfile.db
    container_name: potluck-test-db
    environment:
      POSTGRES_USER: potluck
      POSTGRES_PASSWORD: potluck
      POSTGRES_DB: potluck_test
    ports:
      - "5433:5432"  # Different port to avoid conflicts with dev DB
    volumes:
      - potluck-test-pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potluck -d potluck_test"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: potluck-test-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  potluck-test-pgdata:
    name: potluck-test-pgdata
